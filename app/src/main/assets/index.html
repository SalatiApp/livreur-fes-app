  <script>
    (function() {
      const savedTheme = localStorage.getItem('livrer_fes_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) || savedTheme === null) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

    const VEHICLE_TYPES = ['دراجة نارية', 'دراجة هوائية', 'سيارة', 'هوندا'];
    const PAYMENT_TYPES = ['يومي (باليوم)', 'بالتوصيلة (لكل كورس)', 'شهري', 'أسبوعي'];

    const INITIAL_OFFERS = [];
    const INITIAL_DRIVERS = [];

    const DataService = {
      KEY_OFFERS: 'livrer_fes_offers_v1',
      KEY_DRIVERS: 'livrer_fes_drivers_v1',
      KEY_ROLE: 'livrer_fes_user_role',
      KEY_CITY: 'livrer_fes_city',
      KEY_THEME: 'livrer_fes_theme',

      init() {
        if (!localStorage.getItem(this.KEY_OFFERS)) localStorage.setItem(this.KEY_OFFERS, JSON.stringify(INITIAL_OFFERS));
        if (!localStorage.getItem(this.KEY_DRIVERS)) localStorage.setItem(this.KEY_DRIVERS, JSON.stringify(INITIAL_DRIVERS));
        if (!localStorage.getItem(this.KEY_ROLE)) localStorage.setItem(this.KEY_ROLE, 'shop');
        if (!localStorage.getItem(this.KEY_CITY)) localStorage.setItem(this.KEY_CITY, 'all');
      },

      getOffers() {
        try { return JSON.parse(localStorage.getItem(this.KEY_OFFERS)) || []; } catch (e) { return []; }
      },
      saveOffers(offers) { localStorage.setItem(this.KEY_OFFERS, JSON.stringify(offers)); },
      addOffer(offer) {
        const offers = this.getOffers();
        offer.id = 'off-' + Date.now();
        offer.createdAt = new Date().toISOString().split('T')[0];
        offer.status = 'open';
        offers.unshift(offer);
        this.saveOffers(offers);
        return offer;
      },
      updateOffer(id, updatedFields) {
        const offers = this.getOffers();
        const index = offers.findIndex(o => o.id === id);
        if (index !== -1) {
          offers[index] = { ...offers[index], ...updatedFields };
          this.saveOffers(offers);
          return offers[index];
        }
        return null;
      },
      deleteOffer(id) {
        let offers = this.getOffers();
        offers = offers.filter(o => o.id !== id);
        this.saveOffers(offers);
      },

      getDrivers() {
        try { return JSON.parse(localStorage.getItem(this.KEY_DRIVERS)) || []; } catch (e) { return []; }
      },
      saveDrivers(drivers) { localStorage.setItem(this.KEY_DRIVERS, JSON.stringify(drivers)); },
      addDriver(driver) {
        const drivers = this.getDrivers();
        driver.id = 'drv-' + Date.now();
        driver.createdAt = new Date().toISOString().split('T')[0];
        driver.isAvailable = true;
        drivers.unshift(driver);
        this.saveDrivers(drivers);
        return driver;
      },
      updateDriver(id, updatedFields) {
        const drivers = this.getDrivers();
        const index = drivers.findIndex(d => d.id === id);
        if (index !== -1) {
          drivers[index] = { ...drivers[index], ...updatedFields };
          this.saveDrivers(drivers);
          return drivers[index];
        }
        return null;
      },
      deleteDriver(id) {
        let drivers = this.getDrivers();
        drivers = drivers.filter(d => d.id !== id);
        this.saveDrivers(drivers);
      },

      getUserRole() { return localStorage.getItem(this.KEY_ROLE) || 'shop'; },
      setUserRole(role) { localStorage.setItem(this.KEY_ROLE, role); },
      getSelectedCity() { return localStorage.getItem(this.KEY_CITY) || 'all'; },
      setSelectedCity(cityId) { localStorage.setItem(this.KEY_CITY, cityId); },
      resetAllData() {
        localStorage.setItem(this.KEY_OFFERS, JSON.stringify([]));
        localStorage.setItem(this.KEY_DRIVERS, JSON.stringify([]));
      }
    };

    /* ==========================================================================
       2. UTILITIES & OFFLINE CHECKER
       ========================================================================== */
    function checkOnline(callback) {
      if (!navigator.onLine) {
        showOfflineModal();
        return false;
      }
      if (callback) callback();
      return true;
    }

    function showOfflineModal() { document.getElementById('offlineModal').classList.remove('hidden'); }
    function closeOfflineModal() { document.getElementById('offlineModal').classList.add('hidden'); }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function cleanPhoneNumber(phone) {
      if (!phone) return '';
      let clean = phone.replace(/[^0-9]/g, '');
      if (clean.startsWith('0')) clean = '212' + clean.substring(1);
      else if (!clean.startsWith('212')) clean = '212' + clean;
      return clean;
    }

    function makeWhatsAppLink(phone, contextTitle) {
      const cleaned = cleanPhoneNumber(phone);
      const text = encodeURIComponent(`السلام عليكم، تواصلت معك عبر منصة LIVLINK MA بخصوص ${contextTitle || 'خدمة التوصيل'}.`);
      return `https://wa.me/${cleaned}?text=${text}`;
    }

    function handleContactAction(event, url) {
      event.preventDefault();
      checkOnline(() => { window.open(url, '_blank'); });
    }

    function getCityNameArabic(cityId) { return MOROCCO_CITIES[cityId] ? MOROCCO_CITIES[cityId].nameAr : 'المغرب'; }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let icon = 'fa-circle-info';
      let bg = 'bg-slate-800 text-white dark:bg-white dark:text-slate-900';
      if (type === 'success') {
        icon = 'fa-circle-check';
        bg = 'bg-emerald-600 text-white';
      } else if (type === 'error') {
        icon = 'fa-circle-xmark';
        bg = 'bg-red-600 text-white';
      }

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl font-bold text-xs transform transition-all duration-300 opacity-0 -translate-y-2 ${bg}`;
      toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i><span>${escapeHTML(message)}</span>`;

      container.appendChild(toast);
      
      requestAnimationFrame(() => { toast.classList.remove('opacity-0', '-translate-y-2'); });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    let confirmCallback = null;
    function showConfirmModal(title, message, onConfirm, isDanger = true) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').innerText = title;
      document.getElementById('confirmMessage').innerText = message;
      
      const okBtn = document.getElementById('confirmOkBtn');
      if (isDanger) {
        okBtn.className = 'flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold text-xs shadow-md shadow-red-500/20';
        document.getElementById('confirmIconBox').className = 'w-14 h-14 mx-auto mb-4 rounded-2xl bg-red-100 text-red-600 dark:bg-red-950/50 dark:text-red-400 flex items-center justify-center text-xl';
      } else {
        okBtn.className = 'flex-1 py-2.5 rounded-xl bg-brand-600 text-white font-bold text-xs shadow-md shadow-brand-500/20';
        document.getElementById('confirmIconBox').className = 'w-14 h-14 mx-auto mb-4 rounded-2xl bg-brand-100 text-brand-600 dark:bg-brand-950/50 dark:text-brand-400 flex items-center justify-center text-xl';
      }

      modal.classList.remove('hidden');
      confirmCallback = onConfirm;
    }

    document.getElementById('confirmCancelBtn').onclick = () => {
      document.getElementById('confirmModal').classList.add('hidden');
      confirmCallback = null;
    };

    document.getElementById('confirmOkBtn').onclick = () => {
      document.getElementById('confirmModal').classList.add('hidden');
      if (confirmCallback) confirmCallback();
      confirmCallback = null;
    };

    function openQuickRoleModal() { document.getElementById('roleModal').classList.remove('hidden'); }
    function closeRoleModal() { document.getElementById('roleModal').classList.add('hidden'); }

    function setUserRole(role) {
      DataService.setUserRole(role);
      closeRoleModal();
      updateRoleHeader();
      showToast(role === 'shop' ? 'تم تحويل التطبيق لوضع: صاحب محل' : 'تم تحويل التطبيق لوضع: ليفرور', 'success');
      renderPage(currentPage);
    }

    function updateRoleHeader() {
      const badge = document.getElementById('headerRoleBadge');
      if (badge) {
        const role = DataService.getUserRole();
        badge.innerText = role === 'shop' ? '(صاحب محل)' : '(ليفرور)';
      }
    }

    function handleQuickAdd() {
      const role = DataService.getUserRole();
      navigateTo('create', { mode: role === 'shop' ? 'offer' : 'driver' });
    }

    function handleGlobalCityChange(cityId) {
      DataService.setSelectedCity(cityId);
      showToast(`تم تغيير المدينة إلى: ${getCityNameArabic(cityId)}`, 'info');
      renderPage(currentPage);
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(DataService.KEY_THEME, isDark ? 'dark' : 'light');
      updateThemeIcon();
      if (currentPage === 'home') {
        setTimeout(initHomeMap, 100);
      }
    }

    function updateThemeIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      const container = document.getElementById('themeIconContainer');
      if (container) {
        if (isDark) {
          container.innerHTML = `
            <svg viewBox="0 0 24 24" class="w-4 h-4 text-amber-300 transition-transform duration-300 hover:rotate-12" fill="currentColor">
              <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="#fde047" stroke="#f59e0b" stroke-width="0.5"/>
              <path d="M19 4.5l.4 1.1 1.1.4-1.1.4-.4 1.1-.4-1.1-1.1-.4 1.1-.4z" fill="#ffffff"/>
            </svg>
          `;
        } else {
          container.innerHTML = `
            <svg viewBox="0 0 24 24" class="w-4 h-4 text-amber-400 transition-transform duration-300 hover:rotate-45" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="#f59e0b" stroke-width="2"/>
            </svg>
          `;
        }
      }
    }

    function initTheme() {
      const saved = localStorage.getItem(DataService.KEY_THEME);
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || saved === null) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeIcon();
    }

    let currentPage = 'home';

    let filterCityDriver = '';

    function navigateTo(page, params = {}) {
      currentPage = page;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const btnPage = btn.getAttribute('data-page');
        if (btnPage === page) {
          if (btnPage === 'create') {
            btn.classList.add('text-brand-600');
          } else {
            btn.classList.remove('text-slate-400', 'dark:text-slate-500');
            btn.classList.add('text-brand-600', 'dark:text-brand-400');
          }
        } else {
          if (btnPage !== 'create') {
            btn.classList.remove('text-brand-600', 'dark:text-brand-400');
            btn.classList.add('text-slate-400', 'dark:text-slate-500');
          }
        }
      });

      renderPage(page, params);
    }

    function renderPage(page, params = {}) {
      const container = document.getElementById('appContainer');
      if (page !== 'home' && homeLeafletMap) {
        homeLeafletMap.remove();
        homeLeafletMap = null;
      }

      switch (page) {
        case 'home':
          container.innerHTML = viewHome();
          setTimeout(initHomeMap, 50);
          break;
        case 'offers':
          container.innerHTML = viewOffers();
          break;
        case 'drivers':
          container.innerHTML = viewDrivers();
          break;
        case 'create':
          container.innerHTML = viewCreate(params.mode || (DataService.getUserRole() === 'shop' ? 'offer' : 'driver'));
          break;
        case 'account':
          container.innerHTML = viewAccount();
          break;
        default:
          container.innerHTML = viewHome();
          setTimeout(initHomeMap, 50);
      }
    }

    // خريطة نظيفة بدون أي علامات مائية وبجودة عالية
    function initHomeMap() {
      const mapEl = document.getElementById('homeInteractiveMap');
      if (!mapEl) return;

      if (homeLeafletMap) {
        homeLeafletMap.remove();
        homeLeafletMap = null;
      }

      const currentGlobalCity = DataService.getSelectedCity();
      const cityData = MOROCCO_CITIES[currentGlobalCity] || MOROCCO_CITIES['all'];

      homeLeafletMap = L.map('homeInteractiveMap', {
        zoomControl: false,
        attributionControl: false
      }).setView(cityData.coords, cityData.zoom);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(homeLeafletMap);

      L.control.zoom({ position: 'bottomleft' }).addTo(homeLeafletMap);

      const marker = L.marker(cityData.coords).addTo(homeLeafletMap);
      marker.bindPopup(`<div dir="rtl" style="font-family:'Cairo',sans-serif; font-size:11px; font-weight:bold;">📍 ${cityData.nameAr}<br><span style="font-size:9px; color:#555;">منطقة التوصيل النشطة</span></div>`).openPopup();
    }

            <div class="grid grid-cols-2 gap-3">
              <div onclick="navigateTo('drivers')" class="cursor-pointer group p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:border-brand-500 transition-all">
                <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 flex items-center justify-center text-xl mb-3 group-hover:scale-105 transition-transform">
                  <i class="fa-solid fa-motorcycle"></i>
                </div>
                <h4 class="font-extrabold text-sm text-slate-900 dark:text-white mb-1">قائمة الليفرورات</h4>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-tight">لأصحاب المحلات للبحث عن سائق متوفر</p>

                </div>
              </div>

              <div onclick="navigateTo('offers')" class="cursor-pointer group p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:border-amber-500 transition-all">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/60 text-amber-500 flex items-center justify-center text-xl mb-3 group-hover:scale-105 transition-transform">

            <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 text-center shadow-sm">
              <span class="block text-xl font-black text-amber-500">${availableDriversCount}</span>
              <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">ليفرورات جاهزون</span>

    function renderShopHomeView(city, drivers) {
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">

              رؤية الكل (${drivers.length})

          </div>
          <div class="space-y-3">
            ${drivers.length > 0 
              ? drivers.slice(0, 3).map(driver => renderDriverCard(driver)).join('')

          </div>
        </div>

    function renderDriverHomeView(city, offers) {
      return `
        <div class="space-y-3">

              رؤية الكل (${offers.length})
            </button>
          </div>
          <div class="space-y-3">
            ${offers.length > 0 
              ? offers.slice(0, 3).map(offer => renderOfferCard(offer)).join('')

            }
          </div>
        </div>
      `;

    // 2. OFFERS VIEW
    function getFilteredOffersList() {
      const currentGlobalCity = DataService.getSelectedCity();
      const allOffers = DataService.getOffers();
      
      return allOffers.filter(offer => {
        const matchesGlobalCity = currentGlobalCity === 'all' || offer.city === currentGlobalCity;
        const matchesSelectedCity = !filterCityOffer || offer.city === filterCityOffer;
        const matchesDistrict = !filterDistrictOffer || offer.district === filterDistrictOffer;
        const matchesVehicle = !filterVehicleOffer || offer.vehicle === filterVehicleOffer;
        const matchesPayment = !filterPaymentOffer || offer.paymentType.includes(filterPaymentOffer);
        const matchesSearch = !searchOfferQuery || 
          offer.shopName.toLowerCase().includes(searchOfferQuery.toLowerCase()) ||
          offer.description.toLowerCase().includes(searchOfferQuery.toLowerCase()) ||
          (offer.district && offer.district.toLowerCase().includes(searchOfferQuery.toLowerCase()));
        return matchesGlobalCity && matchesSelectedCity && matchesDistrict && matchesVehicle && matchesPayment && matchesSearch;
      });
    }

    function renderOffersCardsHTML() {
      const filtered = getFilteredOffersList();
      if (filtered.length > 0) {
        return filtered.map(offer => renderOfferCard(offer)).join('');
      } else {
        return `
          <div class="text-center py-12 px-4 rounded-3xl bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-800">
            <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-amber-50 dark:bg-amber-950/40 text-amber-500 flex items-center justify-center text-2xl">
              <i class="fa-solid fa-folder-open"></i>
            </div>
            <h4 class="font-extrabold text-sm text-slate-800 dark:text-slate-200 mb-1">ما كاين حتى عرض مطابق لبحثك حالياً</h4>
            <p class="text-xs text-slate-500 max-w-xs mx-auto mb-4">جرب تغيير المدينة أو الحي، أو قم بنشر عرض جديد.</p>
            <button onclick="resetOfferFilters(); clearOfferSearch();" class="text-xs font-bold px-4 py-2 rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-950/50 dark:text-brand-300">

            </button>
          </div>
        `;
      }
    }

      return `

            >

          </div>

          <div class="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">

              <span class="flex items-center gap-1.5"><i class="fa-solid fa-sliders text-brand-600"></i> تصفية حسب المدينة والحي</span>
              ${(filterCityOffer || filterDistrictOffer || filterVehicleOffer || filterPaymentOffer) ? `

                <option value="">كل الأحياء</option>
                ${availableDistricts.map(d => `<option value="${d}" ${filterDistrictOffer === d ? 'selected' : ''}>${d}</option>`).join('')}
              </select>

              <select onchange="handleOfferVehicleChange(this.value)" class="w-full text-xs font-semibold py-2 px-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:outline-none">
                <option value="">كل المركبات</option>
                ${VEHICLE_TYPES.map(v => `<option value="${v}" ${filterVehicleOffer === v ? 'selected' : ''}>${v}</option>`).join('')}
              </select>

              <select onchange="handleOfferPaymentChange(this.value)" class="w-full text-xs font-semibold py-2 px-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:outline-none">
                <option value="">نوع الدفع</option>
                <option value="يومي" ${filterPaymentOffer === 'يومي' ? 'selected' : ''}>يومي</option>
                <option value="بالتوصيلة" ${filterPaymentOffer === 'بالتوصيلة' ? 'selected' : ''}>بالتوصيلة</option>
                <option value="شهري" ${filterPaymentOffer === 'شهري' ? 'selected' : ''}>شهري</option>
              </select>
            </div>
          </div>

          <div id="offersCardsContainer" class="space-y-3.5">
            ${renderOffersCardsHTML()}
          </div>
        </div>
      `;
    }

              <i class="fa-solid fa-city"></i> ${escapeHTML(cityName)}
            </span>
            ${offer.district ? `
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/50 font-semibold">

              <span>${escapeHTML(offer.notes)}</span>

    // 3. DRIVERS VIEW
    function getFilteredDriversList() {
      const currentGlobalCity = DataService.getSelectedCity();
      const allDrivers = DataService.getDrivers();

      return allDrivers.filter(driver => {
        const matchesGlobalCity = currentGlobalCity === 'all' || driver.city === currentGlobalCity;
        const matchesCity = !filterCityDriver || driver.city === filterCityDriver;
        const matchesDistrict = !filterDistrictDriver || driver.district === filterDistrictDriver;
        const matchesVehicle = !filterVehicleDriver || driver.vehicle === filterVehicleDriver;
        const matchesAvailable = !filterAvailableDriver || 
          (filterAvailableDriver === 'available' ? driver.isAvailable : !driver.isAvailable);
        const matchesSearch = !searchDriverQuery ||
          driver.name.toLowerCase().includes(searchDriverQuery.toLowerCase()) ||
          (driver.district && driver.district.toLowerCase().includes(searchDriverQuery.toLowerCase())) ||
          driver.experience.toLowerCase().includes(searchDriverQuery.toLowerCase());
        return matchesGlobalCity && matchesCity && matchesDistrict && matchesVehicle && matchesAvailable && matchesSearch;
      });
    }

      const filtered = getFilteredDriversList();
      if (filtered.length > 0) {
        return filtered.map(driver => renderDriverCard(driver)).join('');

    }

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">ملاحظات أو امتيازات إضافية</label>
              <input type="text" id="offNotes" placeholder="البنزين مدفوع + وجبة غداء" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
            </div>
          </div>

          <button type="submit" class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-black text-xs sm:text-sm rounded-xl shadow-md shadow-brand-500/20 active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane text-xs"></i> 
            <span class="whitespace-nowrap">نشر العرض مباشرة</span>
          </button>
        </form>
      `;
    }

    function renderDriverForm() {
      const defaultCity = DataService.getSelectedCity() !== 'all' ? DataService.getSelectedCity() : 'casablanca';
      const cityObj = MOROCCO_CITIES[defaultCity] || MOROCCO_CITIES['casablanca'];

      return `
        <form onsubmit="handleDriverSubmit(event)" class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">تسجيل سائق توصيل جديد</h3>
            <p class="text-xs text-slate-500">أنشئ ملفك الشخصي ليجدك أصحاب المحلات والمطاعم بسهولة</p>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الاسم الكامل *</label>
              <input type="text" id="drvName" required placeholder="يوسف العلمي" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المدينة *</label>
                <select id="drvCity" required onchange="updateFormDistricts('drvCity', 'drvDistrict')" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
                  ${Object.keys(MOROCCO_CITIES).filter(k => k !== 'all').map(k => `
                    <option value="${k}" ${k === defaultCity ? 'selected' : ''}>${MOROCCO_CITIES[k].nameAr}</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الحي *</label>
                <select id="drvDistrict" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
                  <option value="">اختر الحي</option>
                  ${cityObj.districts.map(d => `<option value="${d}">${d}</option>`).join('')}
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">وسيلة التوصيل *</label>
              <select id="drvVehicle" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
                ${VEHICLE_TYPES.map(v => `<option value="${v}">${v}</option>`).join('')}
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم الهاتف *</label>
                <input type="tel" id="drvPhone" required placeholder="0612345678" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم WhatsApp *</label>
                <input type="tel" id="drvWhatsapp" required placeholder="0612345678" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">أوقات التفرغ</label>
              <input type="text" id="drvFreeHours" placeholder="مساءً (18:00 - 01:00) أو تفرغ تام" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الخبرة السابقة</label>
              <input type="text" id="drvExperience" placeholder="سنتان في التوصيل الحر مع المطاعم" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">نبذة عنك / ملاحظات</label>
              <textarea id="drvNotes" rows="2" placeholder="أذكر متطلباتك أو مميزاتك..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500"></textarea>
            </div>
          </div>

          <button type="submit" class="w-full py-3.5 px-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-md active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-1.5 leading-normal">
            <i class="fa-solid fa-check text-xs shrink-0"></i> 
            <span class="tracking-wide whitespace-nowrap">تسجيل الملف الشخصي</span>
          </button>
        </form>
      `;
    }

    function updateFormDistricts(citySelectId, districtSelectId) {
      const cityVal = document.getElementById(citySelectId).value;
      const districtSel = document.getElementById(districtSelectId);
      if (!districtSel) return;

      const cityObj = MOROCCO_CITIES[cityVal];
      if (cityObj && cityObj.districts) {
        districtSel.innerHTML = '<option value="">اختر الحي</option>' + 
          cityObj.districts.map(d => `<option value="${d}">${d}</option>`).join('');
      } else {
        districtSel.innerHTML = '<option value="">اختر الحي</option>';
      }
    }

    function handleOfferSubmit(e) {
      e.preventDefault();
      
      checkOnline(() => {
        const newOffer = {
          shopName: document.getElementById('offShopName').value.trim(),
          shopType: document.getElementById('offShopType').value.trim(),
          city: document.getElementById('offCity').value,
          district: document.getElementById('offDistrict').value,
          vehicle: document.getElementById('offVehicle').value,
          paymentType: document.getElementById('offPaymentType').value,
          price: Number(document.getElementById('offPrice').value),
          workingHours: document.getElementById('offWorkingHours').value.trim(),
          phone: document.getElementById('offPhone').value.trim(),
          whatsapp: document.getElementById('offWhatsapp').value.trim(),
          description: document.getElementById('offDescription').value.trim(),
          notes: document.getElementById('offNotes').value.trim()
        };

        DataService.addOffer(newOffer);
        showToast('تم نشر عرض العمل بنجاح!', 'success');
        navigateTo('offers');
      });
    }

    function handleDriverSubmit(e) {
      e.preventDefault();
      
      checkOnline(() => {
        const newDriver = {
          name: document.getElementById('drvName').value.trim(),
          city: document.getElementById('drvCity').value,
          district: document.getElementById('drvDistrict').value,
          vehicle: document.getElementById('drvVehicle').value,
          phone: document.getElementById('drvPhone').value.trim(),
          whatsapp: document.getElementById('drvWhatsapp').value.trim(),
          freeHours: document.getElementById('drvFreeHours').value.trim(),
          experience: document.getElementById('drvExperience').value.trim(),
          notes: document.getElementById('drvNotes').value.trim()
        };

        DataService.addDriver(newDriver);
        showToast('تم تسجيل ملفك كليفرور بنجاح!', 'success');
        navigateTo('drivers');
      });
    }

    // 5. ACCOUNT VIEW
    function viewAccount() {
      const offers = DataService.getOffers();
      const currentRole = DataService.getUserRole();
      const currentCity = DataService.getSelectedCity();

      return `
        <div class="space-y-5">
          <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-amber-500 text-white flex items-center justify-center text-2xl font-black shadow-md">
              <i class="fa-solid fa-user-gear"></i>
            </div>
            <div>
              <h2 class="text-base font-extrabold text-slate-900 dark:text-white">إدارة الحساب والبيانات</h2>
              <p class="text-xs text-slate-500">الوضع الحالي: <span class="font-bold text-brand-600 dark:text-brand-400">${currentRole === 'shop' ? 'صاحب محل' : 'ليفرور'}</span></p>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
            <h3 class="text-xs font-extrabold text-slate-900 dark:text-white">المدينة الافتراضية للتصفح</h3>
            <select onchange="handleGlobalCityChange(this.value)" class="w-full text-xs font-bold py-2.5 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:outline-none">
              ${Object.keys(MOROCCO_CITIES).map(key => `
                <option value="${key}" ${key === currentCity ? 'selected' : ''}>${MOROCCO_CITIES[key].nameAr}</option>
              `).join('')}
            </select>
          </div>

          <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
            <h3 class="text-xs font-extrabold text-slate-900 dark:text-white">تبديل وضع التطبيق</h3>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="setUserRole('shop')" class="py-2.5 px-3 rounded-xl border-2 text-xs font-bold flex items-center justify-center gap-2 transition-all ${currentRole === 'shop' ? 'border-brand-600 bg-brand-50 text-brand-600 dark:bg-brand-950/50' : 'border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400'}">
                <i class="fa-solid fa-shop"></i> أنا صاحب محل
              </button>
              <button onclick="setUserRole('driver')" class="py-2.5 px-3 rounded-xl border-2 text-xs font-bold flex items-center justify-center gap-2 transition-all ${currentRole === 'driver' ? 'border-amber-500 bg-amber-50 text-amber-600 dark:bg-amber-950/50' : 'border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400'}">
                <i class="fa-solid fa-motorcycle"></i> أنا ليفرور
              </button>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-list-check text-brand-600"></i> إدارة عروضي (${offers.length})
              </h3>
            </div>
            <div class="space-y-2 max-h-56 overflow-y-auto pl-1">
              ${offers.length > 0 ? offers.map(o => `
                <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 flex items-center justify-between text-xs">
                  <div>
                    <h5 class="font-bold text-slate-900 dark:text-white">${escapeHTML(o.shopName)}</h5>
                    <span class="text-[10px] text-slate-500">${getCityNameArabic(o.city)} •${escapeHTML(o.district)}</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button onclick="toggleOfferStatus('${o.id}')" class="px-2 py-1 rounded-lg text-[10px] font-bold ${o.status === 'open' ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'}">
                      ${o.status === 'open' ? 'إغلاق' : 'تنشيط'}
                    </button>
                    <button onclick="deleteOfferConfirm('${o.id}')" class="w-7 h-7 rounded-lg bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 flex items-center justify-center">
                      <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                  </div>
                </div>
              `).join('') : '<p class="text-xs text-slate-500 text-center py-2">لا توجد عروض مسجلة بحسابك حالياً.</p>'}
            </div>
          </div>

          <div class="p-4 rounded-3xl bg-red-50/50 dark:bg-red-950/20 border border-red-200/60 dark:border-red-900/40 space-y-2.5">
            <h4 class="text-xs font-bold text-red-700 dark:text-red-400">منطقة الضبط والتحكم</h4>
            <p class="text-[11px] text-slate-600 dark:text-slate-400 leading-normal">تفريغ ومسح جميع البيانات المحلية المسجلة بالتطبيق.</p>
            <button onclick="resetPlatformDataConfirm()" class="w-full py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs shadow-sm active:scale-95 transition-all cursor-pointer">
              <i class="fa-solid fa-rotate-left ml-1"></i> مسح البيانات المحفوظة
            </button>
          </div>
        </div>
      `;
    }

    function toggleOfferStatus(id) {
      const offer = DataService.getOffers().find(o => o.id === id);
      if (offer) {
        const newStatus = offer.status === 'open' ? 'closed' : 'open';
        DataService.updateOffer(id, { status: newStatus });
        showToast(`تم ${newStatus === 'closed' ? 'إغلاق' : 'تنشيط'} العرض بنجاح`, 'success');
        renderPage('account');
      }
    }

    function deleteOfferConfirm(id) {
      showConfirmModal(
        'حذف العرض',
        'هل أنت متأكد من رغبتك في حذف هذا العرض نهائياً؟',
        () => {
          DataService.deleteOffer(id);
          showToast('تم حذف العرض بنجاح', 'success');
          renderPage('account');
        },
        true
      );
    }

    function resetPlatformDataConfirm() {
      showConfirmModal(
        'مسح البيانات',
        'سيتم مسح وتفريغ قائمة العروض والسائقين المسجلة والتخزين المؤقت.',
        () => {
          DataService.resetAllData();
          showToast('تمت إعادة الضبط ومسح البيانات بنجاح', 'success');
          navigateTo('home');
        },
        true
      );
    }

    /* Entry Point */
    document.addEventListener('DOMContentLoaded', () => {
      DataService.init();
      initTheme();
      updateRoleHeader();
      renderPage('home');
    });
  </script>
</body>
</html>
