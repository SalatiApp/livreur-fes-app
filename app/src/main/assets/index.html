        const index = offers.findIndex(o => o.id === id);

          this.saveOffers(offers);
          return offers[index];

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function cleanPhoneNumber(phone) {
      if (!phone) return '';
      let clean = phone.replace(/[^0-9]/g, '');
      if (clean.startsWith('0')) {
        clean = '212' + clean.substring(1);
      } else if (!clean.startsWith('212')) {
        clean = '212' + clean;
      }
      return clean;
    }

    function makeWhatsAppLink(phone, contextTitle) {
      const cleaned = cleanPhoneNumber(phone);
      const text = encodeURIComponent(`السلام عليكم، تواصلت معك عبر تطبيق ليفرور فاس بخصوص ${contextTitle || 'خدمة التوصيل'}.`);
      return `https://wa.me/${cleaned}?text=${text}`;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let icon = SVG_ICONS.info;
      let bg = 'bg-slate-800 text-white dark:bg-white dark:text-slate-900';
      if (type === 'success') {
        icon = SVG_ICONS.check;
        bg = 'bg-emerald-600 text-white';
      } else if (type === 'error') {
        icon = SVG_ICONS.cross;
        bg = 'bg-red-600 text-white';
      }

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl font-bold text-xs transform transition-all duration-300 opacity-0 -translate-y-2 ${bg}`;
      toast.innerHTML = `${icon}<span>${escapeHTML(message)}</span>`;

      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

          <div id="createFormContainer">
            ${activeTab === 'offer' ? renderOfferForm() : renderDriverForm()}
          </div>
        </div>
      `;
    }

    function switchCreateTab(tab) {
      const container = document.getElementById('createFormContainer');
      if (tab === 'offer') {
        container.innerHTML = renderOfferForm();
      } else {
        container.innerHTML = renderDriverForm();
      }
    }

    function renderOfferForm() {
      return `
        <form onsubmit="handleOfferSubmit(event)" class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">إضافة عرض عمل جديد</h3>
            <p class="text-xs text-slate-500">ادخل معلومات المحل أو المطعم للعثور على ليفرور مناسب</p>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">اسم المحل / المطعم *</label>
              <input type="text" id="offShopName" required placeholder="مثال: مطعم الأندلس" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">نوع المحل</label>
                <input type="text" id="offShopType" placeholder="مثال: سناك، صيدلية، مخبزة" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الحي في فاس *</label>
                <select id="offDistrict" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
                  <option value="">اختر الحي</option>
                  ${FES_DISTRICTS.map(d => `<option value="${d}">${d}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">وسيلة النقل المطلوبة *</label>
                <select id="offVehicle" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
                  ${VEHICLE_TYPES.map(v => `<option value="${v}">${v}</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">طريقة الدفع *</label>
                <select id="offPaymentType" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
                  ${PAYMENT_TYPES.map(p => `<option value="${p}">${p}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">المبلغ المقترح (درهم) *</label>
                <input type="number" id="offPrice" required placeholder="مثال: 150" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">أوقات العمل</label>
                <input type="text" id="offWorkingHours" placeholder="مثال: 12:00 - 22:00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم الهاتف *</label>
                <input type="tel" id="offPhone" required placeholder="0612345678" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم WhatsApp *</label>
                <input type="tel" id="offWhatsapp" required placeholder="0612345678" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">وصف العمل *</label>
              <textarea id="offDescription" required rows="3" placeholder="اكتب تفاصيل الطلب والشروط المطلوب توفرها في السائق..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500"></textarea>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">ملاحظات أو امتيازات إضافية</label>
              <input type="text" id="offNotes" placeholder="مثال: البنزين مدفوع + وجبة غداء" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-brand-500">
            </div>
          </div>

          <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-xs rounded-xl shadow-md shadow-brand-500/20 active:scale-95 transition-all flex items-center justify-center gap-1.5">
            ${SVG_ICONS.paperPlane} نشر العرض مباشرة
          </button>
        </form>
      `;
    }

    function renderDriverForm() {
      return `
        <form onsubmit="handleDriverSubmit(event)" class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">تسجيل سائق توصيل جديد</h3>
            <p class="text-xs text-slate-500">أنشئ بروفايلك ليجدك أصحاب المحلات والمطاعم في فاس بسهولة</p>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الاسم الكامل *</label>
              <input type="text" id="drvName" required placeholder="مثال: يوسف العلمي" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الحي المقيم به *</label>
                <select id="drvDistrict" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
                  <option value="">اختر الحي</option>
                  ${FES_DISTRICTS.map(d => `<option value="${d}">${d}</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">وسيلة التوصيل *</label>
                <select id="drvVehicle" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
                  ${VEHICLE_TYPES.map(v => `<option value="${v}">${v}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم الهاتف *</label>
                <input type="tel" id="drvPhone" required placeholder="0612345678" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">رقم WhatsApp *</label>
                <input type="tel" id="drvWhatsapp" required placeholder="0612345678" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">أوقات التفرغ</label>
              <input type="text" id="drvFreeHours" placeholder="مثال: مساءً (18:00 - 01:00) أو تفرغ تام" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">الخبرة السابقة</label>
              <input type="text" id="drvExperience" placeholder="مثال: سنتان في التوصيل الحر مع المطاعم" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500">
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">نبذة عنك / ملاحظات</label>
              <textarea id="drvNotes" rows="2" placeholder="أذكر متطلباتك أو مميزاتك (مثلا: أمتلك صندوق حراري حافظ للحرارة)..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 text-xs focus:outline-none focus:border-amber-500"></textarea>
            </div>
          </div>

          <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-1.5">
            ${SVG_ICONS.check} تسجيل الملف الشخصي
          </button>
        </form>
      `;
    }

    function handleOfferSubmit(e) {
      e.preventDefault();
      const newOffer = {
        shopName: document.getElementById('offShopName').value.trim(),
        shopType: document.getElementById('offShopType').value.trim(),
        district: document.getElementById('offDistrict').value,
        vehicle: document.getElementById('offVehicle').value,
        paymentType: document.getElementById('offPaymentType').value,
        price: Number(document.getElementById('offPrice').value),
        workingHours: document.getElementById('offWorkingHours').value.trim(),
        phone: document.getElementById('offPhone').value.trim(),
        whatsapp: document.getElementById('offWhatsapp').value.trim(),
        description: document.getElementById('offDescription').value.trim(),
        notes: document.getElementById('offNotes').value.trim()
      };

      DataService.addOffer(newOffer);
      showToast('تم نشر عرض العمل بنجاح!', 'success');
      navigateTo('offers');
    }

    function handleDriverSubmit(e) {
      e.preventDefault();
      const newDriver = {
        name: document.getElementById('drvName').value.trim(),
        district: document.getElementById('drvDistrict').value,
        vehicle: document.getElementById('drvVehicle').value,
        phone: document.getElementById('drvPhone').value.trim(),
        whatsapp: document.getElementById('drvWhatsapp').value.trim(),
        freeHours: document.getElementById('drvFreeHours').value.trim(),
        experience: document.getElementById('drvExperience').value.trim(),
        notes: document.getElementById('drvNotes').value.trim()
      };

      DataService.addDriver(newDriver);
      showToast('تم تسجيل بروفايلك كليفرور بنجاح!', 'success');
      navigateTo('drivers');
    }

    // 5. ACCOUNT / SETTINGS VIEW
    function viewAccount() {
      const offers = DataService.getOffers();
      const currentRole = DataService.getUserRole();

      return `
        <div class="space-y-5">
          <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-amber-500 text-white flex items-center justify-center text-2xl font-black shadow-md">
              ${SVG_ICONS.user}
            </div>
            <div>
              <h2 class="text-base font-extrabold text-slate-900 dark:text-white">إدارة الحساب والبيانات</h2>
              <p class="text-xs text-slate-500">الوضع الحالي: <span class="font-bold text-brand-600 dark:text-brand-400">${currentRole === 'shop' ? 'صاحب محل' : 'ليفرور'}</span></p>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
            <h3 class="text-xs font-extrabold text-slate-900 dark:text-white">تبديل وضع التطبيق</h3>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="setUserRole('shop')" class="py-2.5 px-3 rounded-xl border-2 text-xs font-bold flex items-center justify-center gap-2 transition-all ${currentRole === 'shop' ? 'border-brand-600 bg-brand-50 text-brand-600 dark:bg-brand-950/50' : 'border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400'}">
                ${SVG_ICONS.shop} أنا صاحب محل
              </button>
              <button onclick="setUserRole('driver')" class="py-2.5 px-3 rounded-xl border-2 text-xs font-bold flex items-center justify-center gap-2 transition-all ${currentRole === 'driver' ? 'border-amber-500 bg-amber-50 text-amber-600 dark:bg-amber-950/50' : 'border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400'}">
                ${SVG_ICONS.motorcycle} أنا ليفرور
              </button>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                <span class="text-brand-600">${SVG_ICONS.check}</span> إدارة عروضي (${offers.length})
              </h3>
            </div>
            <div class="space-y-2 max-h-56 overflow-y-auto pl-1">
              ${offers.map(o => `
                <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 flex items-center justify-between text-xs">
                  <div>
                    <h5 class="font-bold text-slate-900 dark:text-white">${escapeHTML(o.shopName)}</h5>
                    <span class="text-[10px] text-slate-500">${escapeHTML(o.district)} •${o.price} درهم</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button onclick="toggleOfferStatus('${o.id}')" class="px-2 py-1 rounded-lg text-[10px] font-bold ${o.status === 'open' ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'}">
                      ${o.status === 'open' ? 'إغلاق العرض' : 'إعادة فتح'}
                    </button>
                    <button onclick="deleteOfferConfirm('${o.id}')" class="w-7 h-7 rounded-lg bg-red-100 dark:bg-red-950/50 text-red-600 dark:text-red-400 flex items-center justify-center">
                      ${SVG_ICONS.trash}
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="p-4 rounded-3xl bg-red-50/50 dark:bg-red-950/20 border border-red-200/60 dark:border-red-900/40 space-y-2.5">
            <h4 class="text-xs font-bold text-red-700 dark:text-red-400">منطقة التحكم والضبط</h4>
            <p class="text-[11px] text-slate-600 dark:text-slate-400 leading-normal">يمكنك استعادة البيانات الافتراضية للتطبيق في حال أردت مسح البيانات المخزنة محلياً.</p>
            <button onclick="resetPlatformDataConfirm()" class="w-full py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs shadow-sm active:scale-95 transition-all flex items-center justify-center gap-1">
              ${SVG_ICONS.rotateLeft} إعادة ضبط البيانات الافتراضية
            </button>
          </div>
        </div>
      `;
    }

    function toggleOfferStatus(id) {
      const offer = DataService.getOffers().find(o => o.id === id);
      if (offer) {
        const newStatus = offer.status === 'open' ? 'closed' : 'open';
        DataService.updateOffer(id, { status: newStatus });
        showToast(`تم ${newStatus === 'closed' ? 'إغلاق' : 'تنشيط'} العرض بنجاح`, 'success');
        renderPage('account');
      }
    }

    function deleteOfferConfirm(id) {
      showConfirmModal(
        'حذف العرض',
        'هل أنت تأكد من رغبتك في حذف هذا العرض نهائياً؟',
        () => {
          DataService.deleteOffer(id);
          showToast('تم حذف العرض بنجاح', 'success');
          renderPage('account');
        },
        true
      );
    }

    function resetPlatformDataConfirm() {
      showConfirmModal(
        'إعادة ضبط البيانات',
        'سيتم استرجاع قائمة العروض والسائقين الافتراضية المسجلة أول مرة.',
        () => {
          DataService.resetAllData();
          showToast('تمت إعادة ضبط البيانات بنجاح', 'success');
          navigateTo('home');
        },
        true
      );
    }

    /* Application Entry Point */
    document.addEventListener('DOMContentLoaded', () => {
      DataService.init();
      initTheme();
      updateRoleHeader();
      renderPage('home');
    });
  </script>
</body>
</html>
