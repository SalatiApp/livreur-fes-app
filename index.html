    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function cleanPhoneNumber(phone) {
      if (!phone) return '';
      let clean = phone.replace(/[^0-9]/g, '');
      if (clean.startsWith('0')) {
        clean = '212' + clean.substring(1);
      } else if (!clean.startsWith('212')) {
        clean = '212' + clean;
      }
      return clean;
    }

    function makeWhatsAppLink(phone, contextTitle) {
      const cleaned = cleanPhoneNumber(phone);
      const text = encodeURIComponent(`السلام عليكم، تواصلت معك عبر تطبيق ليفرور فاس بخصوص ${contextTitle || 'خدمة التوصيل'}.`);
      return `https://wa.me/${cleaned}?text=${text}`;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let icon = 'fa-circle-info';
      let bg = 'bg-slate-800 text-white dark:bg-white dark:text-slate-900';
      if (type === 'success') {
        icon = 'fa-circle-check';
        bg = 'bg-emerald-600 text-white';
      } else if (type === 'error') {
        icon = 'fa-circle-xmark';
        bg = 'bg-red-600 text-white';
      }

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl font-bold text-xs transform transition-all duration-300 opacity-0 -translate-y-2 ${bg}`;
      toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i><span>${escapeHTML(message)}</span>`;

      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Form Submissions with validation
    function handleOfferSubmit(e) {
      e.preventDefault();
      
      const shopName = document.getElementById('offerShopName').value.trim();
      const shopType = document.getElementById('offerShopType').value.trim();
      const district = document.getElementById('offerDistrict').value;
      const vehicle = document.getElementById('offerVehicle').value;
      const paymentType = document.getElementById('offerPaymentType').value;
      const priceVal = document.getElementById('offerPrice').value.trim();
      const price = parseFloat(priceVal);
      const workingHours = document.getElementById('offerWorkingHours').value.trim();
      const phone = document.getElementById('offerPhone').value.trim();
      const whatsapp = document.getElementById('offerWhatsapp').value.trim() || phone;
      const description = document.getElementById('offerDescription').value.trim();
      const notes = document.getElementById('offerNotes').value.trim();

      // Reset errors
      let hasError = false;
      const setErr = (id, msg) => {
        const el = document.getElementById(id);
        if (msg) {
          el.innerText = msg;
          el.classList.remove('hidden');
          hasError = true;
        } else {
          el.classList.add('hidden');
        }
      };

      setErr('errOfferShopName', !shopName ? 'المرجو إدخال اسم المحل' : '');
      setErr('errOfferDistrict', !district ? 'المرجو اختيار الحي' : '');
      setErr('errOfferVehicle', !vehicle ? 'المرجو اختيار نوع المركبة' : '');
      setErr('errOfferPrice', (!priceVal || isNaN(price) || price <= 0) ? 'المبلغ يجب أن يكون أكبر من 0 درهم' : '');
      setErr('errOfferPhone', (!phone || phone.length < 8) ? 'المرجو إدخال رقم هاتف صحيح' : '');
      setErr('errOfferDescription', (!description || description.length < 10) ? 'المرجو إدخال تفاصيل العمل (10 أحرف على الأقل)' : '');

      if (hasError) {
        showToast('المرجو إكمال البيانات المطلوبة بشكل صحيح', 'error');
        return;
      }

      DataService.addOffer({
        shopName,
        shopType,
        district,
        vehicle,
        paymentType,
        price,
        workingHours,
        phone,
        whatsapp,
        description,
        notes
      });

      showToast('تم نشر العرض بنجاح', 'success');
      navigateTo('offers');
    }

    function handleDriverSubmit(e) {

      let hasError = false;
      const setErr = (id, msg) => {
        const el = document.getElementById(id);
        if (msg) {
          el.innerText = msg;
          el.classList.remove('hidden');
          hasError = true;
        } else {
          el.classList.add('hidden');
        }
      };

      setErr('errDriverName', !name ? 'المرجو إدخال الاسم الكامل' : '');

      setErr('errDriverVehicle', !vehicle ? 'المرجو اختيار نوع المركبة' : '');

                  </div>
                  <div>
                    <h5 class="text-xs font-bold text-slate-900 dark:text-white">الوضع الداكن (Dark Mode)</h5>
                    <p class="text-[11px] text-slate-500">مريح للعين أثناء الاستخدام الليلي</p>
                  </div>
                </div>
                <button onclick="toggleDarkMode(); renderPage('account');" class="w-12 h-6 rounded-full transition-colors relative ${isDark ? 'bg-brand-600' : 'bg-slate-300'}">
                  <span class="w-5 h-5 rounded-full bg-white absolute top-0.5 transition-transform ${isDark ? 'right-6' : 'right-1'}"></span>
                </button>
              </div>

              <!-- City Item -->
              <div class="flex items-center justify-between pt-3">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-city"></i>
                  </div>
                  <div>
                    <h5 class="text-xs font-bold text-slate-900 dark:text-white">المدينة الحالية</h5>
                    <p class="text-[11px] text-slate-500">قابلة للتوسيع لمدن أخرى مستقبلاً</p>
                  </div>
                </div>
                <span class="text-xs font-black text-brand-600 px-3 py-1 rounded-xl bg-brand-50 dark:bg-brand-950">فاس Fès</span>
              </div>

              <!-- Reset Mock Data Item -->
              <div class="flex items-center justify-between pt-3">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-2xl bg-red-50 dark:bg-red-950/40 flex items-center justify-center text-red-600">
                    <i class="fa-solid fa-rotate-left"></i>
                  </div>
                  <div>
                    <h5 class="text-xs font-bold text-red-600">إعادة تعيين البيانات المحلية</h5>
                    <p class="text-[11px] text-slate-500">استرجاع بيانات Mock وحذف التعديلات</p>
                  </div>
                </div>
                <button onclick="confirmResetAllData()" class="px-3 py-1.5 rounded-xl bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 text-xs font-bold">
                  إعادة تعيين
                </button>
              </div>
            </div>
          </div>

          <!-- Free App & Contact Notice -->
          <div class="p-4 rounded-3xl bg-brand-50 dark:bg-brand-950/40 border border-brand-200 dark:border-brand-900/60 text-center space-y-2">
            <h5 class="text-xs font-extrabold text-brand-900 dark:text-brand-200">تطبيق ليفرور فاس - منصة مجانية 100%</h5>
            <p class="text-[11px] text-brand-700 dark:text-brand-300">
              بدون اشتراكات وبدون اقتطاعات. صمم لمساعدة شباب وأصحاب محلات مدينة فاس.
            </p>
          </div>
        </div>
      `;
    }

    // CRUD Handlers for Account
    function toggleOfferStatus(id) {
      const offers = DataService.getOffers();
      const offer = offers.find(o => o.id === id);
      if (offer) {
        const nextStatus = offer.status === 'open' ? 'closed' : 'open';
        DataService.updateOffer(id, { status: nextStatus });
        showToast(nextStatus === 'open' ? 'تم فتح العرض مجدداً' : 'تم إغلاق العرض', 'success');
        renderPage('account');
      }
    }

    function confirmDeleteOffer(id) {
      showConfirmModal(
        'حذف العرض',
        'واش متأكد بغيتي تحذف هاد العرض؟ ما غيبقاش يبان للمستخدمين.',
        () => {
          DataService.deleteOffer(id);
          showToast('تم حذف العرض بنجاح', 'success');
          renderPage('account');
        },
        true
      );
    }

    function confirmResetAllData() {
      showConfirmModal(
        'إعادة تعيين البيانات',
        'واش متأكد بغيتي تمسح البيانات وترجع البيانات التجريبية الأصلية؟',
        () => {
          DataService.resetAllData();
          showToast('تمت إعادة ضبط البيانات التجريبية', 'success');
          renderPage('account');
        },
        true
      );
    }

    /* ==========================================================================
       5. INITIALIZATION
       ========================================================================== */
    function startApp() {
      DataService.init();
      initTheme();
      updateRoleHeader();
      renderPage('home');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
