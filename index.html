  <script>
    /* ==========================================================================

    const VEHICLE_TYPES = ['دراجة نارية', 'دراجة هوائية', 'سيارة', 'هوندا'];
    const PAYMENT_TYPES = ['يومي (باليوم)', 'بالتوصيلة (لكل كورس)', 'شهري'];

    const INITIAL_OFFERS = [
      { id: 'off-1', shopName: 'مطعم فاس الأصيل', city: 'فاس', district: 'أكدال', price: 180, lat: 34.0300, lng: -5.0100, phone: '0661234567', whatsapp: '0661234567', description: 'توصيل وجبات غداء وعشاء داخل أحيـاء فاس.', status: 'open' },
      { id: 'off-2', shopName: 'سناك كازا بلاكا', city: 'الدار البيضاء', district: 'المعاريف', price: 220, lat: 33.5883, lng: -7.6322, phone: '0662345678', whatsapp: '0662345678', description: 'سائق دراجة لتوصيل طلبات السناك بمرتفعات المعاريف.', status: 'open' },
      { id: 'off-3', shopName: 'صيدلية الرباط المركزية', city: 'الرباط', district: 'حسان', price: 150, lat: 34.0209, lng: -6.8416, phone: '0663456789', whatsapp: '0663456789', description: 'توصيل الأدوية للمنازل المجاورة.', status: 'open' },
      { id: 'off-4', shopName: 'حلويات كورش مراكش', city: 'مراكش', district: 'جليز', price: 190, lat: 31.6348, lng: -8.0108, phone: '0664567890', whatsapp: '0664567890', description: 'توزيع الحلويات على المقاهي.', status: 'open' }
    ];

    const INITIAL_DRIVERS = [
      { id: 'drv-1', name: 'ياسين الفاسي', city: 'فاس', district: 'أكدال', vehicle: 'دراجة نارية', lat: 34.0350, lng: -5.0050, phone: '0671112233', whatsapp: '0671112233', isAvailable: true, experience: 'سنتان توصيل' },
      { id: 'drv-2', name: 'مهدي البيضاوي', city: 'الدار البيضاء', district: 'المعارف', vehicle: 'دراجة نارية', lat: 33.5800, lng: -7.6200, phone: '0672223344', whatsapp: '0672223344', isAvailable: true, experience: '3 سنوات توصيل' },
      { id: 'drv-3', name: 'حمزة المراكشي', city: 'مراكش', district: 'جليز', vehicle: 'سيارة', lat: 31.6300, lng: -8.0000, phone: '0673334455', whatsapp: '0673334455', isAvailable: true, experience: 'سائق مهني' }
    ];

    const DataService = {
      KEY_OFFERS: 'livrer_maroc_offers_v2',
      KEY_DRIVERS: 'livrer_maroc_drivers_v2',
      KEY_ROLE: 'livrer_maroc_role_v2',

      init() {
        if (!localStorage.getItem(this.KEY_OFFERS)) localStorage.setItem(this.KEY_OFFERS, JSON.stringify(INITIAL_OFFERS));
        if (!localStorage.getItem(this.KEY_DRIVERS)) localStorage.setItem(this.KEY_DRIVERS, JSON.stringify(INITIAL_DRIVERS));
        if (!localStorage.getItem(this.KEY_ROLE)) localStorage.setItem(this.KEY_ROLE, 'shop');
      },
      getOffers() { return JSON.parse(localStorage.getItem(this.KEY_OFFERS)) || INITIAL_OFFERS; },
      saveOffers(offers) { localStorage.setItem(this.KEY_OFFERS, JSON.stringify(offers)); },
      addOffer(offer) {
        const offers = this.getOffers();
        offer.id = 'off-' + Date.now();
        offer.status = 'open';
        const targetCity = MOROCCO_CITIES.find(c => c.name === offer.city);
        offer.lat = targetCity ? targetCity.lat + (Math.random() * 0.02 - 0.01) : 31.7917;
        offer.lng = targetCity ? targetCity.lng + (Math.random() * 0.02 - 0.01) : -7.0926;
        offers.unshift(offer);
        this.saveOffers(offers);
      },
      getDrivers() { return JSON.parse(localStorage.getItem(this.KEY_DRIVERS)) || INITIAL_DRIVERS; },
      saveDrivers(drivers) { localStorage.setItem(this.KEY_DRIVERS, JSON.stringify(drivers)); },
      addDriver(driver) {
        const drivers = this.getDrivers();
        driver.id = 'drv-' + Date.now();
        driver.isAvailable = true;
        const targetCity = MOROCCO_CITIES.find(c => c.name === driver.city);
        driver.lat = targetCity ? targetCity.lat + (Math.random() * 0.02 - 0.01) : 31.7917;
        driver.lng = targetCity ? targetCity.lng + (Math.random() * 0.02 - 0.01) : -7.0926;
        drivers.unshift(driver);
        this.saveDrivers(drivers);
      },
      getUserRole() { return localStorage.getItem(this.KEY_ROLE) || 'shop'; },
      setUserRole(role) { localStorage.setItem(this.KEY_ROLE, role); }
    };

    /* ==========================================================================
       2. GOOGLE MAPS ENGINE (MOROCCO WIDE)
       ========================================================================== */
    let mapInstance = null;
    let mapMarkers = [];

    function initGoogleMapsApp() {
      console.log("Google Maps API initialized successfully.");
    }

    function renderGoogleMap() {
      const container = document.getElementById('googleMapCanvas');
      if (!container) return;

      const moroccoCenter = { lat: 31.7917, lng: -7.0926 };
      mapInstance = new google.maps.Map(container, {
        zoom: 6,
        center: moroccoCenter,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        zoomControl: true,
        styles: document.documentElement.classList.contains('dark') ? getDarkMapStyle() : []
      });

      loadMapMarkers();
    }

    function loadMapMarkers() {
      mapMarkers.forEach(m => m.setMap(null));
      mapMarkers = [];

      const offers = DataService.getOffers();
      const drivers = DataService.getDrivers();

      offers.forEach(o => {
        if (!o.lat || !o.lng) return;
        const marker = new google.maps.Marker({
          position: { lat: o.lat, lng: o.lng },
          map: mapInstance,
          title: o.shopName,
          icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        });

        const info = new google.maps.InfoWindow({
          content: `
            <div style="direction: rtl; text-align: right; font-family: 'Cairo', sans-serif; padding: 4px;">
              <h4 style="font-weight: 800; color: #1e3a8a; font-size: 13px;">🛒 ${o.shopName}</h4>
              <p style="font-size: 11px; color: #475569;">📍 ${o.city} - ${o.district}</p>
              <p style="font-size: 11px; font-weight: bold; color: #d97706; margin: 3px 0;">الأجر: ${o.price} درهم</p>
              <div style="margin-top: 6px; display: flex; gap: 4px;">
                <a href="tel:${o.phone}" style="background: #2563eb; color: white; padding: 3px 8px; border-radius: 6px; font-size: 10px; text-decoration: none; font-weight: bold;">اتصال</a>
                <a href="https://wa.me/212${o.whatsapp.substring(1)}" target="_blank" style="background: #16a34a; color: white; padding: 3px 8px; border-radius: 6px; font-size: 10px; text-decoration: none; font-weight: bold;">واتساب</a>
              </div>
            </div>
          `
        });
        marker.addListener("click", () => info.open(mapInstance, marker));
        mapMarkers.push(marker);
      });

      drivers.forEach(d => {
        if (!d.lat || !d.lng) return;
        const marker = new google.maps.Marker({
          position: { lat: d.lat, lng: d.lng },
          map: mapInstance,
          title: d.name,
          icon: "https://maps.google.com/mapfiles/ms/icons/orange-dot.png"
        });

        const info = new google.maps.InfoWindow({
          content: `
            <div style="direction: rtl; text-align: right; font-family: 'Cairo', sans-serif; padding: 4px;">
              <h4 style="font-weight: 800; color: #d97706; font-size: 13px;">🏍️ ${d.name}</h4>
              <p style="font-size: 11px; color: #475569;">📍 ${d.city} - ${d.district}</p>
              <p style="font-size: 10px; color: #16a34a; font-weight: bold; margin-top: 2px;">متاح للتوصيل</p>
              <div style="margin-top: 6px; display: flex; gap: 4px;">
                <a href="tel:${d.phone}" style="background: #2563eb; color: white; padding: 3px 8px; border-radius: 6px; font-size: 10px; text-decoration: none; font-weight: bold;">اتصال</a>
                <a href="https://wa.me/212${d.whatsapp.substring(1)}" target="_blank" style="background: #16a34a; color: white; padding: 3px 8px; border-radius: 6px; font-size: 10px; text-decoration: none; font-weight: bold;">واتساب</a>
              </div>
            </div>
          `
        });
        marker.addListener("click", () => info.open(mapInstance, marker));
        mapMarkers.push(marker);
      });
    }

    function centerMapToCity(cityName) {
      const target = MOROCCO_CITIES.find(c => c.name === cityName);
      if (target && mapInstance) {
        mapInstance.setCenter({ lat: target.lat, lng: target.lng });
        mapInstance.setZoom(12);
        showToast(`تم التوجيه إلى ${cityName}`, 'success');
      }
    }

    function locateUserGPS() {
      if (navigator.geolocation && mapInstance) {
        navigator.geolocation.getCurrentPosition(pos => {
          const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          mapInstance.setCenter(coords);
          mapInstance.setZoom(14);
          new google.maps.Marker({
            position: coords,
            map: mapInstance,
            icon: "https://maps.google.com/mapfiles/ms/icons/green-dot.png",
            title: "موقعك الحالي"
          });
          showToast("تم تحديد موقعك بدقة", "success");
        }, () => {
          showToast("تعذر تحديد الموقع الجغرافي", "error");
        });
      }
    }

    function getDarkMapStyle() {
      return [
        { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
        { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
      ];
    }

    /* ==========================================================================
       3. SPA ROUTING ENGINE
       ========================================================================== */
    let currentPage = 'home';

    function navigateTo(page) {
      currentPage = page;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.getAttribute('data-page') === page) {
          btn.classList.add('text-brand-600');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('text-brand-600');
          btn.classList.add('text-slate-400');
        }
      });

      renderPage(page);
    }

    function renderPage(page) {
      const container = document.getElementById('appContainer');
      switch (page) {
        case 'home': container.innerHTML = viewHome(); break;
        case 'offers': container.innerHTML = viewOffers(); break;
        case 'map':
          container.innerHTML = viewMap();
          setTimeout(renderGoogleMap, 250);
          break;
        case 'drivers': container.innerHTML = viewDrivers(); break;
        case 'create': container.innerHTML = viewCreate(); break;
        case 'account': container.innerHTML = viewAccount(); break;
        default: container.innerHTML = viewHome();
      }
    }

    /* ==========================================================================
       4. VIEWS & TEMPLATES
       ========================================================================== */
    function viewHome() {
      const offersCount = DataService.getOffers().length;
      const driversCount = DataService.getDrivers().length;

      return `
        <div class="space-y-5">

    function viewMap() {

    function viewOffers() {
      const offers = DataService.getOffers();
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-black">عروض التوصيل بالمغرب</h2>

          </div>
          <div class="space-y-3">
            ${offers.map(o => `
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-2">
                <div class="flex justify-between items-start">
                  <h4 class="font-extrabold text-base">${o.shopName}</h4>

    function viewDrivers() {
      const drivers = DataService.getDrivers();
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-black">الليفرورات المتوفرون</h2>
            <button onclick="navigateTo('create')" class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs">سجل كليفرور</button>
          </div>
          <div class="space-y-3">
            ${drivers.map(d => `
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-2">

    function viewCreate() {
      return `
        <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4">
          <h3 class="text-base font-black">نشر عرض جديد أو تسجيل كليفرور</h3>
          
          <div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
            <button onclick="switchFormMode('offer')" id="tabOfferBtn" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white dark:bg-slate-900 text-brand-600 shadow-sm">عرض عمل (محل)</button>
            <button onclick="switchFormMode('driver')" id="tabDriverBtn" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-500">سائق (ليفرور)</button>
          </div>

          <div id="formContainerContent">
            <form onsubmit="handleOfferCreation(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold mb-1">اسم المحل أو المطعم</label>
                <input type="text" id="newShopName" required placeholder="مثال: مطعم الأطلس" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">المدينة المغربية</label>
                <select id="newShopCity" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                  ${MOROCCO_CITIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-bold mb-1">الحي</label>
                  <input type="text" id="newShopDistrict" required placeholder="أكدال، المعاريف..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">الأجر (درهم)</label>
                  <input type="number" id="newShopPrice" required placeholder="180" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-bold mb-1">رقم الهاتف</label>
                  <input type="tel" id="newShopPhone" required placeholder="06..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">واتساب</label>
                  <input type="tel" id="newShopWhatsapp" placeholder="06..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">التفاصيل والشروط</label>
                <textarea id="newShopDesc" rows="2" placeholder="تفاصيل التوصيل..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs"></textarea>
              </div>
              <button type="submit" class="w-full py-3 bg-brand-600 text-white font-extrabold rounded-2xl text-xs">نشر العرض فوراً</button>
            </form>
          </div>
        </div>
      `;
    }

    function switchFormMode(mode) {
      const container = document.getElementById('formContainerContent');
      const btnOffer = document.getElementById('tabOfferBtn');
      const btnDriver = document.getElementById('tabDriverBtn');

      if (mode === 'offer') {
        btnOffer.className = "flex-1 py-2 rounded-lg text-xs font-bold bg-white dark:bg-slate-900 text-brand-600 shadow-sm";
        btnDriver.className = "flex-1 py-2 rounded-lg text-xs font-bold text-slate-500";
        container.innerHTML = `
          <form onsubmit="handleOfferCreation(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1">اسم المحل أو المطعم</label>
              <input type="text" id="newShopName" required placeholder="مثال: مطعم الأطلس" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">المدينة المغربية</label>
              <select id="newShopCity" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                ${MOROCCO_CITIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold mb-1">الحي</label>
                <input type="text" id="newShopDistrict" required placeholder="أكدال، المعاريف..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">الأجر (درهم)</label>
                <input type="number" id="newShopPrice" required placeholder="180" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold mb-1">رقم الهاتف</label>
                <input type="tel" id="newShopPhone" required placeholder="06..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">واتساب</label>
                <input type="tel" id="newShopWhatsapp" placeholder="06..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">التفاصيل والشروط</label>
              <textarea id="newShopDesc" rows="2" placeholder="تفاصيل التوصيل..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs"></textarea>
            </div>
            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-extrabold rounded-2xl text-xs">نشر العرض فوراً</button>
          </form>
        `;
      } else {
        btnDriver.className = "flex-1 py-2 rounded-lg text-xs font-bold bg-white dark:bg-slate-900 text-amber-500 shadow-sm";
        btnOffer.className = "flex-1 py-2 rounded-lg text-xs font-bold text-slate-500";
        container.innerHTML = `
          <form onsubmit="handleDriverCreation(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1">الاسم الكامل</label>
              <input type="text" id="newDrvName" required placeholder="مثال: حمزة العلوي" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">المدينة المغربية</label>
              <select id="newDrvCity" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                ${MOROCCO_CITIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold mb-1">الحي</label>
                <input type="text" id="newDrvDistrict" required placeholder="الحي..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">نوع المركبة</label>
                <select id="newDrvVehicle" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
                  ${VEHICLE_TYPES.map(v => `<option value="${v}">${v}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold mb-1">الهاتف</label>
                <input type="tel" id="newDrvPhone" required placeholder="06..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">واتساب</label>
                <input type="tel" id="newDrvWhatsapp" placeholder="06..." class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border text-xs">
              </div>
            </div>
            <button type="submit" class="w-full py-3 bg-amber-500 text-slate-950 font-extrabold rounded-2xl text-xs">تسجيل كليفرور</button>
          </form>
        `;
      }
    }

    function handleOfferCreation(e) {
      e.preventDefault();
      DataService.addOffer({
        shopName: document.getElementById('newShopName').value.trim(),
        city: document.getElementById('newShopCity').value,
        district: document.getElementById('newShopDistrict').value.trim(),
        price: parseFloat(document.getElementById('newShopPrice').value),
        phone: document.getElementById('newShopPhone').value.trim(),
        whatsapp: document.getElementById('newShopWhatsapp').value.trim() || document.getElementById('newShopPhone').value.trim(),
        description: document.getElementById('newShopDesc').value.trim()
      });
      showToast("تم نشر العرض بنجاح!", "success");
      navigateTo('offers');
    }

    function handleDriverCreation(e) {
      e.preventDefault();
      DataService.addDriver({
        name: document.getElementById('newDrvName').value.trim(),
        city: document.getElementById('newDrvCity').value,
        district: document.getElementById('newDrvDistrict').value.trim(),
        vehicle: document.getElementById('newDrvVehicle').value,
        phone: document.getElementById('newDrvPhone').value.trim(),
        whatsapp: document.getElementById('newDrvWhatsapp').value.trim() || document.getElementById('newDrvPhone').value.trim()
      });
      showToast("تم تسجيلك كليفرور بنجاح!", "success");
      navigateTo('drivers');
    }

    function viewAccount() {
      return `
        <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center space-y-3">
          <i class="fa-solid fa-earth-africa text-5xl text-brand-600"></i>
          <h3 class="font-extrabold text-base">منصة ليفرور المغرب</h3>
          <p class="text-xs text-slate-500">التطبيق جاهز بالكامل لتغطية جميع مدن المملكة باستخدام مفتاح Google Maps الخاص بك.</p>
        </div>
      `;
    }

    /* ==========================================================================
       5. UTILITIES & INIT
       ========================================================================== */
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-xl text-xs font-bold text-white shadow-xl ${type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'}`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      if (currentPage === 'map') renderGoogleMap();
    }

    function openQuickRoleModal() { document.getElementById('roleModal').classList.remove('hidden'); }
    function closeRoleModal() { document.getElementById('roleModal').classList.add('hidden'); }
    function setUserRole(role) { DataService.setUserRole(role); closeRoleModal(); showToast("تم تحديث وضع الاستخدام", "success"); }

    function startApp() {
      DataService.init();
      navigateTo('home');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
