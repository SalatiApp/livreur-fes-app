name: Build Livlink MA Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/*
          cp -r dist/* app/src/main/assets/
          echo "Web assets successfully compiled and synced to Android assets."

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare and verify signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="${{ runner.temp }}/livlink.jks"
          rm -f "$KEYSTORE"

          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi

          PASSWORD="${KEYSTORE_PASSWORD:-${STORE_PASSWORD:-${KEY_PASSWORD:-}}}"
          if [ -z "$PASSWORD" ]; then
            echo "::error::Signing password secret (KEYSTORE_PASSWORD or STORE_PASSWORD) is missing or empty."
            exit 1
          fi

          # Decode the base64 keystore into livlink.jks, cleaning any line-endings and ignoring garbage
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode -i > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Decoded livlink.jks is empty. Verify the SIGNING_KEYSTORE_BASE64 secret format."
            exit 1
          fi

          # 1. Verify that the keystore can be read with the password and that alias 'upload' exists
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$PASSWORD" -alias upload >/dev/null 2>&1; then
            echo "::error::Unable to find alias 'upload' in livlink.jks using the provided password. Please check alias name or password."
            exit 1
          fi

          # 2. Verify that the private key for alias 'upload' is unlocked with the password (prevents BadPaddingException)
          TEST_CSR="${{ runner.temp }}/signing-verify.csr"
          rm -f "$TEST_CSR"
          if ! keytool -certreq -alias upload -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" -file "$TEST_CSR" -noprompt >/dev/null 2>&1; then
            echo "::error::Failed to decrypt key 'upload' (Given final block not properly padded). The key password does not match the keystore."
            rm -f "$TEST_CSR"
            exit 1
          fi
          rm -f "$TEST_CSR"

          echo "livlink.jks successfully verified: alias 'upload' and password are valid and accessible."
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/livlink.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          if test ! -d app; then
            echo "::error::app directory is missing from repository root."
            exit 1
          fi

          if test ! -f ./gradlew; then
            echo "::error::gradlew is missing from repository root."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease --stacktrace

      - name: Verify APK and extract SHA-1
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)

          if test -z "$APK_PATH"; then
            echo "::error::Release APK not found in app/build/outputs/apk/release."
            exit 1
          fi

          echo "Found APK at: $APK_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if test -z "$APKSIGNER"; then
            APKSIGNER=$(find "$HOME" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH" | tee "${{ runner.temp }}/cert-info.txt"
            SHA1=$(grep -i 'certificate SHA-1' "${{ runner.temp }}/cert-info.txt" | head -n 1 | sed 's/.*: *//' || true)
            if [ -n "$SHA1" ]; then
              {
                echo "## LIVLINK MA Release SHA-1 Fingerprint"
                echo ""
                echo "\`\`\`"
                echo "$SHA1"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "${{ runner.temp }}/livlink.jks"
          rm -f "${{ runner.temp }}/cert-info.txt"
          rm -f "${{ runner.temp }}/signing-verify.csr"
