name: Build Livlink MA Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/*
          cp -r dist/* app/src/main/assets/
          echo "Web assets successfully compiled and synced to Android assets."

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare and verify signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/livlink-key.jks"

          if test -n "${SIGNING_KEYSTORE_BASE64:-}" && test -n "${STORE_PASSWORD:-}" && test -n "${KEY_PASSWORD:-}"; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
            if test ! -s "$KEYSTORE"; then
              echo "::error::Decoded keystore is empty."
              exit 1
            fi
            keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias upload > /dev/null
            echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Production upload signing key verified."
          else
            echo "::warning::Signing secrets not found in repository secrets. Generating self-signed release key for artifact generation."
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=LIVLINK MA, OU=Mobile, O=LIVLINK, L=Fes, C=MA"
            echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          set -euo pipefail

          if test ! -d app; then
            echo "::error::app directory is missing from repository root."
            exit 1
          fi

          if test ! -f ./gradlew; then
            echo "::error::gradlew is missing from repository root."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease --stacktrace

      - name: Verify APK and extract SHA-1
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)

          if test -z "$APK_PATH"; then
            echo "::error::Release APK not found in app/build/outputs/apk/release."
            exit 1
          fi

          echo "Found APK at: $APK_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if test -z "$APKSIGNER"; then
            APKSIGNER=$(find "$HOME" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/cert-info.txt"
            SHA1=$(grep -i 'certificate SHA-1' "$RUNNER_TEMP/cert-info.txt" | head -n 1 | sed 's/.*: *//' || true)
            if [ -n "$SHA1" ]; then
              {
                echo "## LIVLINK MA Release SHA-1 Fingerprint"
                echo ""
                echo "\`\`\`"
                echo "$SHA1"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/livlink-key.jks"
          rm -f "$RUNNER_TEMP/cert-info.txt"
