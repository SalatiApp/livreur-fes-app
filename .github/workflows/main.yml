name: Build Livlink MA Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/*
          cp -r dist/* app/src/main/assets/
          echo "Web assets successfully compiled and synced to Android assets."

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify and prepare signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SEC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SEC_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SEC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SEC_SIGNING_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SEC_REL_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SEC_REL_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="${{ runner.temp }}/livlink.jks"
          rm -f "$KEYSTORE"

          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::error title=Missing Secret::SIGNING_KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi

          # 1. Decode base64 keystore
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE" 2>/dev/null || true
          if [ ! -s "$KEYSTORE" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE" 2>/dev/null || true
          fi

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error title=Corrupted Secret::Failed to decode SIGNING_KEYSTORE_BASE64. The decoded file is empty."
            exit 1
          fi

          KS_SIZE=$(wc -c < "$KEYSTORE")
          echo "Decoded keystore size: ${KS_SIZE} bytes."

          if [ "$KS_SIZE" -lt 100 ]; then
            echo "::error title=Invalid File Size::Decoded keystore is unexpectedly small (${KS_SIZE} bytes). Check SIGNING_KEYSTORE_BASE64."
            exit 1
          fi

          # 2. Inspect header magic bytes (safe, no secrets)
          MAGIC=$(od -An -tx1 -N4 "$KEYSTORE" 2>/dev/null | tr -d ' \n' || true)
          echo "Keystore magic header: ${MAGIC}"

          DETECTED_TYPE=""
          if [ "$MAGIC" = "feedfeed" ]; then
            DETECTED_TYPE="jks"
          elif [ "$MAGIC" = "cececece" ]; then
            DETECTED_TYPE="jceks"
          elif [[ "$MAGIC" == 3082* ]]; then
            DETECTED_TYPE="pkcs12"
          fi
          echo "Detected format by magic: ${DETECTED_TYPE:-generic}"

          # 3. Gather candidate passwords safely without boolean expression collapse
          CANDIDATES=()
          for p in \
            "${SEC_KEYSTORE_PASSWORD:-}" \
            "${SEC_STORE_PASSWORD:-}" \
            "${SEC_KEY_PASSWORD:-}" \
            "${SEC_SIGNING_PASSWORD:-}" \
            "${SEC_REL_STORE_PASS:-}" \
            "${SEC_REL_KEY_PASS:-}"; do
            if [ -n "$p" ]; then
              CANDIDATES+=("$p")
              # Also add trimmed version if different
              p_trimmed=$(printf '%s' "$p" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              if [ "$p_trimmed" != "$p" ] && [ -n "$p_trimmed" ]; then
                CANDIDATES+=("$p_trimmed")
              fi
            fi
          done

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error title=Missing Password::No password secrets found. Set KEYSTORE_PASSWORD or STORE_PASSWORD."
            exit 1
          fi

          # 4. Test store password with keytool
          WORKING_STOREPASS=""
          WORKING_STORETYPE=""

          for cand in "${CANDIDATES[@]}"; do
            for stype in "${DETECTED_TYPE}" "" "jks" "pkcs12"; do
              TYPE_ARGS=()
              if [ -n "$stype" ]; then
                TYPE_ARGS=("-storetype" "$stype")
              fi
              if keytool -list -keystore "$KEYSTORE" -storepass "$cand" "${TYPE_ARGS[@]}" >/dev/null 2>&1; then
                WORKING_STOREPASS="$cand"
                WORKING_STORETYPE="$stype"
                break 2
              fi
            done
          done

          if [ -z "$WORKING_STOREPASS" ]; then
            echo "::error title=Store Password Failed::None of the provided secrets opened the keystore. Please verify KEYSTORE_PASSWORD / STORE_PASSWORD."
            {
              echo "### ❌ Keystore Diagnostic Summary"
              echo "- **File Size:** ${KS_SIZE} bytes"
              echo "- **Magic Bytes:** \`${MAGIC}\` (${DETECTED_TYPE:-unknown})"
              echo "- **Store Password Test:** FAILED for all candidate secrets"
              echo "- **Action Required:** Verify KEYSTORE_PASSWORD / STORE_PASSWORD in GitHub Secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Keystore store password verified successfully."

          # 5. List and check aliases in the keystore
          STORETYPE_OPT=()
          if [ -n "$WORKING_STORETYPE" ]; then
            STORETYPE_OPT=("-storetype" "$WORKING_STORETYPE")
          fi

          # First: Direct test for alias 'upload' (standard in keytool across all JDK versions)
          TARGET_ALIAS="upload"
          ALIAS_FOUND=false
          if LC_ALL=C keytool -list -keystore "$KEYSTORE" -storepass "$WORKING_STOREPASS" "${STORETYPE_OPT[@]}" -alias "$TARGET_ALIAS" >/dev/null 2>&1; then
            ALIAS_FOUND=true
          fi

          # Extract all aliases using both standard keytool output and verbose mode (-v)
          ALIASES=""
          # Method A: Verbose listing with LC_ALL=C (contains "Alias name: <alias>")
          V_OUTPUT=$(LC_ALL=C keytool -list -v -keystore "$KEYSTORE" -storepass "$WORKING_STOREPASS" "${STORETYPE_OPT[@]}" 2>/dev/null || true)
          ALIASES=$(echo "$V_OUTPUT" | grep -i '^[[:space:]]*Alias name:' | sed 's/^[[:space:]]*[Aa]lias name:[[:space:]]*//' | tr -d '\r' | grep -v '^$' || true)

          # Method B: Standard non-verbose listing (lines like "upload, Oct 10, 2026, PrivateKeyEntry,")
          if [ -z "$ALIASES" ]; then
            S_OUTPUT=$(LC_ALL=C keytool -list -keystore "$KEYSTORE" -storepass "$WORKING_STOREPASS" "${STORETYPE_OPT[@]}" 2>/dev/null || true)
            ALIASES=$(echo "$S_OUTPUT" | grep -E ',.*Entry' | sed 's/,.*//' | tr -d '\r' | grep -v '^$' || true)
          fi

          # Method C: Fallback to comma-separated date lines
          if [ -z "$ALIASES" ]; then
            ALIASES=$(echo "$S_OUTPUT" | awk -F',' '/,/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); if ($1 != "" && $1 !~ /^Keystore type/ && $1 !~ /^Keystore provider/) print $1}' | tr -d '\r' || true)
          fi

          # If direct test succeeded but ALIASES string was empty, set ALIASES to upload
          if [ "$ALIAS_FOUND" = true ] && [ -z "$ALIASES" ]; then
            ALIASES="$TARGET_ALIAS"
          fi

          echo "Found alias(es) in keystore:"
          echo "${ALIASES:-none}"

          # Check if TARGET_ALIAS exists either by direct check or listed aliases
          if [ "$ALIAS_FOUND" = false ] && ! echo "$ALIASES" | grep -qxi "^${TARGET_ALIAS}$"; then
            echo "::error title=Alias Missing::Alias '$TARGET_ALIAS' not found in keystore. Found: ${ALIASES:-none}"
            {
              echo "### ❌ Keystore Diagnostic Summary"
              echo "- **Store Password:** Valid"
              echo "- **Expected Alias:** \`$TARGET_ALIAS\`"
              echo "- **Found Aliases:** \`${ALIASES:-none}\`"
              echo "- **Action Required:** The keystore does not contain the alias '$TARGET_ALIAS'. Please verify the keystore contents."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 6. Test decrypting the private key for alias 'upload' (prevents Given final block not properly padded)
          WORKING_KEYPASS=""
          TEST_CSR="${{ runner.temp }}/test-key.csr"

          # Test key password candidates
          for kcand in "${SEC_KEY_PASSWORD:-}" "$WORKING_STOREPASS" "${CANDIDATES[@]}"; do
            if [ -z "$kcand" ]; then continue; fi
            rm -f "$TEST_CSR"
            if keytool -certreq -alias "$TARGET_ALIAS" -keystore "$KEYSTORE" -storepass "$WORKING_STOREPASS" -keypass "$kcand" -file "$TEST_CSR" -noprompt "${STORETYPE_OPT[@]}" >/dev/null 2>&1; then
              WORKING_KEYPASS="$kcand"
              rm -f "$TEST_CSR"
              break
            fi
            rm -f "$TEST_CSR"
          done

          if [ -z "$WORKING_KEYPASS" ]; then
            # Capture the exact failure message safely
            ERR_MSG=$(keytool -certreq -alias "$TARGET_ALIAS" -keystore "$KEYSTORE" -storepass "$WORKING_STOREPASS" -keypass "$WORKING_STOREPASS" -file "$TEST_CSR" -noprompt "${STORETYPE_OPT[@]}" 2>&1 || true)
            rm -f "$TEST_CSR"

            echo "::error title=Key Decryption Failed (BadPaddingException)::The keystore was opened, but the private key 'upload' could NOT be decrypted with KEY_PASSWORD. Error: ${ERR_MSG}"
            {
              echo "### ❌ Key Password Decryption Failed"
              echo "- **Keystore:** Valid (${KS_SIZE} bytes, ${WORKING_STORETYPE:-auto})"
              echo "- **Alias:** \`upload\` found"
              echo "- **Store Password:** Valid"
              echo "- **Key Password:** FAILED — UnrecoverableKeyException: Given final block not properly padded"
              echo "- **Root Cause:** The key password set inside the keystore for alias 'upload' does NOT match KEY_PASSWORD or KEYSTORE_PASSWORD."
              echo "- **Action Required:** Verify the exact private key password for alias 'upload' and update the KEY_PASSWORD secret in GitHub."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # In PKCS12 keystores (standard in Android/Java), the key password is by standard identical to the store password.
          if [ "${WORKING_STORETYPE,,}" = "pkcs12" ]; then
            WORKING_KEYPASS="$WORKING_STOREPASS"
          fi

          echo "Private key for alias '$TARGET_ALIAS' verified successfully."

          # Mask both passwords from logs
          echo "::add-mask::$WORKING_STOREPASS"
          echo "::add-mask::$WORKING_KEYPASS"

          # Export to GITHUB_ENV for Gradle
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$WORKING_STOREPASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$WORKING_KEYPASS" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$WORKING_STOREPASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$WORKING_KEYPASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$TARGET_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$TARGET_ALIAS" >> "$GITHUB_ENV"
          if [ -n "$WORKING_STORETYPE" ]; then
            echo "STORE_TYPE=$WORKING_STORETYPE" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_TYPE=$WORKING_STORETYPE" >> "$GITHUB_ENV"
          fi

          {
            echo "### ✅ Keystore & Key Verification Passed"
            echo "- **Keystore File:** Verified (${KS_SIZE} bytes)"
            echo "- **Format:** \`${WORKING_STORETYPE:-auto}\`"
            echo "- **Alias:** \`upload\` (Private key decrypted successfully)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          if test ! -d app; then
            echo "::error::app directory is missing from repository root."
            exit 1
          fi

          if test ! -f ./gradlew; then
            echo "::error::gradlew is missing from repository root."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease \
            -PRELEASE_STORE_FILE="$KEYSTORE_PATH" \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            ${STORE_TYPE:+-PRELEASE_STORE_TYPE="$STORE_TYPE"} \
            --stacktrace

      - name: Verify APK and extract SHA-1
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)

          if test -z "$APK_PATH"; then
            echo "::error::Release APK not found in app/build/outputs/apk/release."
            exit 1
          fi

          echo "Found APK at: $APK_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if test -z "$APKSIGNER"; then
            APKSIGNER=$(find "$HOME" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH" | tee "${{ runner.temp }}/cert-info.txt"
            SHA1=$(grep -i 'certificate SHA-1' "${{ runner.temp }}/cert-info.txt" | head -n 1 | sed 's/.*: *//' || true)
            if [ -n "$SHA1" ]; then
              {
                echo "## LIVLINK MA Release SHA-1 Fingerprint"
                echo ""
                echo "\`\`\`"
                echo "$SHA1"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "${{ runner.temp }}/livlink.jks"
          rm -f "${{ runner.temp }}/cert-info.txt"
          rm -f "${{ runner.temp }}/test-key.csr"
