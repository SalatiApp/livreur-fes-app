name: Build Livlink MA Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Web Application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/*
          cp -r dist/* app/src/main/assets/
          echo "Web assets successfully compiled and synced to Android assets."

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare and verify signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 1. Clean up any previous temporary keys and initialize isolated directory
          KEYSTORE_DIR="$RUNNER_TEMP/livlink_keystore"
          rm -rf "$KEYSTORE_DIR"
          rm -f "$RUNNER_TEMP/livlink-key.jks" "$RUNNER_TEMP/livlink-release.jks"
          mkdir -p "$KEYSTORE_DIR"

          KEYSTORE_FILE="$KEYSTORE_DIR/livlink.jks"
          ACTIVE_STORE_PASS=""
          ACTIVE_KEY_PASS=""
          USE_REPO_SECRETS=false

          # 2. Check if repository secrets are provided and test if key can be recovered
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ]; then
            CANDIDATE_FILE="$KEYSTORE_DIR/candidate.jks"
            if printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$CANDIDATE_FILE" 2>/dev/null && [ -s "$CANDIDATE_FILE" ]; then
              TEST_KEY_PW="${KEY_PASSWORD:-$STORE_PASSWORD}"
              TEST_CSR="$KEYSTORE_DIR/candidate_check.csr"
              rm -f "$TEST_CSR"

              # Test candidate key extraction with keytool
              if keytool -certreq -alias upload -keystore "$CANDIDATE_FILE" -storepass "$STORE_PASSWORD" -keypass "$TEST_KEY_PW" -file "$TEST_CSR" -noprompt >/dev/null 2>&1; then
                USE_REPO_SECRETS=true
                mv "$CANDIDATE_FILE" "$KEYSTORE_FILE"
                ACTIVE_STORE_PASS="$STORE_PASSWORD"
                ACTIVE_KEY_PASS="$TEST_KEY_PW"
                rm -f "$TEST_CSR"
                echo "Repository signing keystore and key password verified successfully."
              elif keytool -certreq -alias upload -keystore "$CANDIDATE_FILE" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" -file "$TEST_CSR" -noprompt >/dev/null 2>&1; then
                USE_REPO_SECRETS=true
                mv "$CANDIDATE_FILE" "$KEYSTORE_FILE"
                ACTIVE_STORE_PASS="$STORE_PASSWORD"
                ACTIVE_KEY_PASS="$STORE_PASSWORD"
                rm -f "$TEST_CSR"
                echo "Repository signing keystore verified using store password as key password."
              else
                echo "::warning::Repository signing secrets failed key recovery check. Will generate a clean verified test keystore."
              fi
            fi
            rm -f "$CANDIDATE_FILE"
          fi

          # 3. If repository secrets are absent or invalid, generate a fresh test keystore with matching passwords
          if [ "$USE_REPO_SECRETS" != "true" ]; then
            rm -f "$KEYSTORE_FILE"
            WORKFLOW_PASS="livlink_release_pass_2026"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12 \
              -storepass "$WORKFLOW_PASS" \
              -keypass "$WORKFLOW_PASS" \
              -dname "CN=LIVLINK MA, OU=Mobile, O=LIVLINK, L=Fes, C=MA" >/dev/null 2>&1

            ACTIVE_STORE_PASS="$WORKFLOW_PASS"
            ACTIVE_KEY_PASS="$WORKFLOW_PASS"
            echo "Clean test keystore generated with unified credentials."
          fi

          # 4. Strictly verify with keytool that the key is readable and recoverable before passing to Gradle
          VERIFY_CSR="$KEYSTORE_DIR/verify_check.csr"
          rm -f "$VERIFY_CSR"
          if ! keytool -certreq -alias upload -keystore "$KEYSTORE_FILE" -storepass "$ACTIVE_STORE_PASS" -keypass "$ACTIVE_KEY_PASS" -file "$VERIFY_CSR" -noprompt >/dev/null 2>&1; then
            echo "::error::Keystore verification failed: unable to recover key 'upload' with the specified password."
            rm -f "$VERIFY_CSR"
            exit 1
          fi
          rm -f "$VERIFY_CSR"
          echo "Keystore readiness confirmed: alias 'upload' is fully recoverable."

          # 5. Export values to GITHUB_ENV without printing secrets
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$ACTIVE_STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ACTIVE_KEY_PASS" >> "$GITHUB_ENV"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          if test ! -d app; then
            echo "::error::app directory is missing from repository root."
            exit 1
          fi

          if test ! -f ./gradlew; then
            echo "::error::gradlew is missing from repository root."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease \
            -PKEYSTORE_PATH="${KEYSTORE_PATH}" \
            -PSTORE_PASSWORD="${STORE_PASSWORD}" \
            -PKEY_PASSWORD="${KEY_PASSWORD}" \
            --stacktrace

      - name: Verify APK and extract SHA-1
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)

          if test -z "$APK_PATH"; then
            echo "::error::Release APK not found in app/build/outputs/apk/release."
            exit 1
          fi

          echo "Found APK at: $APK_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if test -z "$APKSIGNER"; then
            APKSIGNER=$(find "$HOME" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/cert-info.txt"
            SHA1=$(grep -i 'certificate SHA-1' "$RUNNER_TEMP/cert-info.txt" | head -n 1 | sed 's/.*: *//' || true)
            if [ -n "$SHA1" ]; then
              {
                echo "## LIVLINK MA Release SHA-1 Fingerprint"
                echo ""
                echo "\`\`\`"
                echo "$SHA1"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup temporary signing files
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP:-/tmp}/livlink_keystore"
          rm -f "${RUNNER_TEMP:-/tmp}/cert-info.txt"
