
name: Build Livlink MA Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare and verify signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if test -z "${SIGNING_KEYSTORE_BASE64:-}" || test -z "${STORE_PASSWORD:-}" || test -z "${KEY_PASSWORD:-}"; then
            echo "::error::One or more signing secrets are missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/livlink-key.jks"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"

          if test ! -s "$KEYSTORE"; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias upload > /dev/null

          keytool -certreq -alias upload -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/signing-check.csr" -noprompt

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Signing key verified."

      - name: Build Release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/livlink-key.jks
        run: |
          set -euo pipefail

          if test ! -f ./gradlew; then
            echo "::error::gradlew is missing from the repository root."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache :app:assembleRelease --stacktrace

      - name: Verify APK and extract SHA-1
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)

          if test -z "$APK_PATH"; then
            echo "::error::Release APK not found."
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if test -z "$APKSIGNER"; then
            APKSIGNER=$(find "$HOME" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          fi

          if test -z "$APKSIGNER"; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/cert-info.txt"

          SHA1=$(grep -i 'certificate SHA-1' "$RUNNER_TEMP/cert-info.txt" | head -n 1 | sed 's/.*: *//')

          if test -z "$SHA1"; then
            echo "::error::SHA-1 fingerprint not found."
            exit 1
          fi

          {
            echo "## LIVLINK MA SHA-1 Certificate Fingerprint"
            echo ""
            echo "$SHA1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/livlink-key.jks"
          rm -f "$RUNNER_TEMP/signing-check.csr"
          rm -f "$RUNNER_TEMP/cert-info.txt"
