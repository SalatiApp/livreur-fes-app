
name: Build Livlink MA Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/livlink-key.jks"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/livlink-key.jks" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Livlink MA,O=Livlink MA,C=MA"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/livlink-key.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: gradle --no-daemon --no-configuration-cache --no-build-cache --project-dir . :app:assembleRelease --stacktrace

      - name: Extract SHA-1 Certificate Fingerprint
        shell: bash
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APK_PATH" ] || [ -z "$APKSIGNER" ]; then
            echo "ERROR: APK or apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/cert-info.txt"

          SHA1=$(grep -i "certificate SHA-1" "$RUNNER_TEMP/cert-info.txt" | head -n 1 | sed 's/.*: //')

          if [ -z "$SHA1" ]; then
            echo "ERROR: SHA-1 fingerprint not found"
            exit 1
          fi

          echo "## LIVLINK SHA-1 Certificate Fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Save signing key for safekeeping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: livlink-signing-key-BACKUP
          path: ${{ runner.temp }}/livlink-key.jks
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/livlink-key.jks"
