name: Build Livlink MA Release APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.3.1'
      cache-disabled: true

  - name: Prepare release keystore
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    run: |
      test -n "$SIGNING_KEYSTORE_BASE64"
      echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/livlink-release.jks"

  - name: Build Release APK
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/livlink-release.jks
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: gradle --no-daemon --no-configuration-cache --build-cache=false --project-dir . :App:assembleRelease --stacktrace

  - name: Upload Release APK
    uses: actions/upload-artifact@v4
    with:
      name: app-release
      path: App/build/outputs/apk/release/*.apk
      if-no-files-found: error

  - name: Remove release keystore
    if: always()
    run: rm -f "$RUNNER_TEMP/livlink-release.jks"
